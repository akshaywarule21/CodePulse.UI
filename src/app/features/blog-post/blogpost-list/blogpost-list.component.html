<p>blogpost-list works!</p>
<div class="container">
    <h1 class="mt-3">Blogpost List</h1>
    <div class="d-flex justify-content-end mt-3">
        <a [routerLink]="['/admin/blogposts/add']" class="btn btn-primary">Add Blogpost</a>
    </div>
    <ng-container *ngIf="blogPosts$ | async as blogPosts">
    <table class="table table-bordered mt-3">
      <thead>
        <tr>
         
          <th>Title</th>
          
            <th>Short Description</th>
            <th>Is Visible</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let post of blogPosts">
      
          <td>{{post.title}}</td>
          <td>{{post.shortDescription}}</td>
          <td>{{post.isVisible}}</td>
          <td>
            <span *ngFor="let cat of post.categories">
              <span class="badge bg-secondary me-1">{{cat.name}}</span>
            </span>
          </td>
          <td><a class="btn btn-light" [routerLink]="['/admin/blogposts', post.id]">Edit</a></td>

        </tr>

      <tbody>
    
    </table>


  </ng-container>

</div>
