<div>
<ng-container *ngIf="model">
<div class="container">
    <h1 class="mt-3">Add Blogposts</h1>
    <form (ngSubmit)="onFormSubmit()" #form="ngForm">
        <div class="mt-2">
            <div class="mt-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" class="form-control" name="title" [(ngModel)]="model.title">
            </div>
             <div class="mt-3">
                <label for="urlHandle" class="form-label">UrlHandle</label>
                <input type="text" id="urlHandle" class="form-control" name="urlHandle" [(ngModel)]="model.urlHandle">
            </div>
            <div class="mt-3">
                <label for="shortDescription" class="form-label">Short Description</label>
                <input type="text" id="shortDescription" class="form-control" name="shortDescription" [(ngModel)]="model.shortDescription">
            </div>
             <div class="mt-3">
                <label for="content" class="form-label">Content</label>
                <div class="d-flex flex-row">
                    <div class="col-6 p-2">
                        <textarea id="content" class="form-control" name="content" [(ngModel)]="model.content"></textarea>
                    </div>
                    <div class="col-6 p-2" style="max-height: 350px; overflow-y: scroll;">
                        <markdown [data]="model.content"></markdown>
                    </div>

                </div>
                
            </div>
             <div class="mt-3">
                <label for="featureImageUrl" class="form-label">Feature Image URL
                    <button type="button" class="btn btn-light" (click)="openImageSelector()">Select Image</button>
                </label>
                <ng-container *ngIf="model.featuredImageUrl">
                    <div>
                        <img [src]="model.featuredImageUrl" alt="Featured Image" class="my-2" height="100">
                    </div>
                </ng-container>
                <input type="text" id="featureImageUrl" class="form-control" name="featureImageUrl" [(ngModel)]="model.featuredImageUrl">
            </div>
            <div class="mt-3">
                <label for="publishedDate" class="form-label">Published Date</label>
                <input type="date" id="publishedDate" class="form-control" name="publishedDate" [ngModel]="model.publishedDate  | date:'yyyy-MM-dd'" (ngModelChange)="model.publishedDate = $event">
            </div>
             <div class="mt-3">
                <label for="author" class="form-label">Author</label>
                <input type="text" id="author" class="form-control" name="author" [(ngModel)]="model.author">
            </div>
            <div class="mt-3">
                <label for="categories" class="form-label">Categories</label>
                <ng-container *ngIf="categories$ | async as categories">
                    <select id="categories" class="form-control" name="categories" [(ngModel)]="selectedCategories" multiple>
                        <option *ngFor="let category of categories" [value]="category.id" >{{ category.name }}</option>
                    </select>
                </ng-container>
            </div> 

            <div class="form-check mt-3">
                <input type="checkbox" id="isVisible" class="form-check-input" name="isVisible"  [(ngModel)]="model.isVisible">
                <label for="isVisible" class="form-check-label" name="isVisible">Is Visible</label>

            </div>
            <div class="d-flex mt-3">
                <button type="submit" class="btn btn-primary">Updated Blogpost</button>
                <button type="button" class="btn btn-danger ms-2" (click)="onDelete()">Delete</button>
                <button type="button" class="btn btn-secondary ms-2" (click)="onCancel()">Cancel</button>
            </div>
        </div>
    </form>
</div>    
</ng-container>
</div>

<div class="images-container-modal" [ngClass]="{'d-block': isImageSelectorVisible, 'd-none': !isImageSelectorVisible}">
    <button type="button" class="btn btn-light" style="position: fixed; top: 10px; right: 10px;" (click)="isImageSelectorVisible=false">X</button>
    <app-image-selector></app-image-selector>
</div>
