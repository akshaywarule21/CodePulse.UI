<div class="container">
    <h1 class="mt-3">Edit Category</h1>
    <ng-container *ngIf="category; else notFound">

        <form #form="ngForm" (ngSubmit)="onFormSubmit()">
            <div class="mt-2">
                <label for="categoryId" class="form-label">Category Id</label>
                <input type="text" disabled class="form-control" id="categoryId" [(ngModel)]="category.id" name="id">
            </div>
            <div class="mt-2">
                <label for="categoryName" class="form-label">Category Name</label>
                <input type="text" class="form-control" id="categoryName" [(ngModel)]="category.name" name="categoryName">
            </div>
            <div class="mt-2">
                <label for="categoryUrlHandle" class="form-label">Category Url</label>
                <input type="text" class="form-control" id="categoryUrlHandle" [(ngModel)]="category.urlHandle" name="categoryUrlHandle">
            </div>
            <div class="mt-2 d-flex gap-2">
                <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Save</button>
                 <button type="button" class="btn btn-danger" (click)="onDeleteCategory()" [disabled]="form.invalid">Delete</button>

            </div>
            
        </form>
    </ng-container>

    <ng-template #notFound>
        <div class="alert alert-danger" role="alert">
            Category not found.
        </div>
    </ng-template>
</div>
